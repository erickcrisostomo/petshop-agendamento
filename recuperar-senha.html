<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH Pet Banho e Tosa - Recuperar Senha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png?v=3">
</head>

<body>
  <header>
    <img src="LogoPet.jpg" alt="Logo TH Pet Banho e Tosa">
  </header>

  <main>
    <section>
      <h2>Recuperar Senha</h2>
      <p style="font-size: 0.85rem; text-align: center; margin-bottom: 20px; color: #fce7f3;">
        Digite seu e-mail para receber as instruções de redefinição.
      </p>

      <form id="form-recuperar">
        <div class="campo">
          <label for="email-recuperar">E-mail</label>
          <input type="email" id="email-recuperar" placeholder="seu@email.com" required>
        </div>

        <button type="submit">Enviar E-mail</button>

        <div id="mensagem" class="mensagem" style="margin-top: 15px;"></div>

        <div class="link-cadastro" style="margin-top: 15px;">
          <a href="index.html">Voltar para o Login</a>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <ul>
      <li><a href="#">Privacidade</a></li>
      <li><a href="#">Termos</a></li>
    </ul>
    <p><small>&copy; 2026 Th. Todos os direitos reservados.</small></p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://cjfofohvanlraxkjbftc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DldDRI623dY73et-9oWc6Q_zlbwwXMb';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('form-recuperar');
    const msg = document.getElementById('mensagem');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email-recuperar').value.trim();
      const botao = form.querySelector('button[type="submit"]');

      msg.className = 'mensagem carregando';
      msg.textContent = 'Enviando...';
      botao.disabled = true;

      try {
        // Mantém o link correto tanto em hospedagens quanto ao abrir o projeto localmente.
        const redirectTo = new URL('redefinir-senha.html', window.location.href).href;
        const { error } = await _supabase.auth.resetPasswordForEmail(email, { redirectTo });

        if (error) {
          msg.className = 'mensagem erro';
          // Exibe a mensagem real retornada pelo Supabase
          msg.textContent = 'Erro: ' + error.message;
          console.error('Detalhes do erro:', error);
        } else {
          msg.className = 'mensagem sucesso';
          msg.textContent = 'E-mail enviado com sucesso! Verifique sua caixa de entrada.';
        }
      } catch (error) {
        console.error('Falha inesperada ao solicitar recuperação:', error);
        msg.className = 'mensagem erro';
        msg.textContent = 'Não foi possível enviar o e-mail agora. Tente novamente.';
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>

</html>
