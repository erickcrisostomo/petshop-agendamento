<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - TH Pet</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <header>
    <img src="LogoPet.jpg" alt="Logo TH Pet Banho e Tosa">
  </header>

  <main>
    <section>
      <h2>Recuperar Senha</h2>
      <p style="font-size: 0.85rem; text-align: center; margin-bottom: 20px; color: #fce7f3;">
        Digite seu e-mail para receber as instruções de redefinição.
      </p>

      <form id="form-recuperar">
        <div class="campo">
          <label for="email-recuperar">E-mail</label>
          <input type="email" id="email-recuperar" placeholder="seu@email.com" required>
        </div>

        <button type="submit">Enviar E-mail</button>

        <div id="mensagem" class="mensagem" style="margin-top: 15px;"></div>

        <div class="link-cadastro" style="margin-top: 15px;">
          <a href="index.html">Voltar para o Login</a>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <ul>
      <li><a href="#">Privacidade</a></li>
      <li><a href="#">Termos</a></li>
    </ul>
    <p><small>&copy; 2026 Th. Todos os direitos reservados.</small></p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://cjfofohvanlraxkjbftc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DldDRI623dY73et-9oWc6Q_zlbwwXMb';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('form-recuperar');
    const msg = document.getElementById('mensagem');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email-recuperar').value.trim();

      msg.className = 'mensagem';
      msg.textContent = 'Enviando...';

      const { error } = await _supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/redefinir-senha.html',
      });

      if (error) {
        msg.className = 'mensagem erro';
        msg.textContent = 'Erro ao enviar e-mail. Verifique o endereço digitado.';
      } else {
        msg.className = 'mensagem sucesso';
        msg.textContent = 'E-mail de recuperação enviado! Verifique sua caixa de entrada.';
      }
    });
  </script>
</body>

</html>
