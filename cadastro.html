<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH Pet Banho e Tosa - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="LogoPet.jpg" alt="Logo TH Pet Banho e Tosa">
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Suporte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Criar Conta</h2>
            <form id="form-cadastro">
                <div class="campo">
                    <label for="campo-nome">Nome Completo</label>
                    <input type="text" id="campo-nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo">
                    <label for="campo-telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="campo-telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo">
                    <label for="campo-email">E-mail</label>
                    <input type="email" id="campo-email" placeholder="seu@email.com" required>
                </div>

                <div class="campo">
                    <label for="campo-senha">Senha</label>
                    <input type="password" id="campo-senha" placeholder="Crie uma senha" required>
                </div>

                <div class="campo">
                    <label for="campo-confirmar-senha">Confirmar Senha</label>
                    <input type="password" id="campo-confirmar-senha" placeholder="Repita a senha" required>
                </div>

                <button type="submit">Cadastrar</button>

                <div id="mensagem" class="mensagem"></div>

                <div class="link-cadastro">
                    <p>Já possui uma conta? <a href="index.html">Faça login</a></p>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <ul>
            <li><a href="#">Privacidade</a></li>
            <li><a href="#">Termos</a></li>
        </ul>
        <p><small>&copy; 2026 Th. Todos os direitos reservados.</small></p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cadastro.js"></script>
</body>

</html>
